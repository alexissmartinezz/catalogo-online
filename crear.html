<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Crear catálogo</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>Crear mi catálogo</h1>
    <p>Completá los datos de tu negocio.</p>
  </header>

  <main>

    <section>

      <form id="catalogoForm">

        <label>Nombre del negocio</label>
        <input
          type="text"
          id="negocio"
          placeholder="Ej: Brix Shop"
          required
        >

        <label>WhatsApp</label>
        <input
          type="tel"
          id="whatsapp"
          placeholder="Ej: 549XXXXXXXXXX"
          required
        >

        <h2>Productos</h2>

        <div id="productos">

          <div class="producto">

            <label>Foto del producto</label>
            <input
              type="file"
              class="foto"
              accept="image/*"
            >

            <label>Nombre</label>
            <input
              type="text"
              class="nombreProducto"
              placeholder="Ej: Remera Oversize"
              required
            >

            <label>Precio</label>
            <input
              type="number"
              class="precioProducto"
              placeholder="25000"
              required
            >

            <label>Descripción</label>
            <textarea
              class="descripcionProducto"
              placeholder="Descripción del producto"
            ></textarea>

          </div>

        </div>

        <button
          type="button"
          class="btn"
          onclick="agregarProducto()"
        >
          + Agregar otro producto
        </button>

        <br><br>

        <button type="submit" class="btn">
          Crear catálogo
        </button>

      </form>

    </section>

  </main>

  <script src="script.js"></script>

</body>
  </html>
