<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mi catálogo</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1 id="nombreNegocio">Mi negocio</h1>
    <p>Catálogo de productos</p>
  </header>

  <main>

    <div id="listaProductos"></div>

  </main>

  <script>

    const datos = JSON.parse(
      localStorage.getItem("catalogo")
    );

    if (datos) {

      document.getElementById("nombreNegocio").textContent =
        datos.negocio;

      const lista =
        document.getElementById("listaProductos");


      datos.productos.forEach(function(producto) {

        const tarjeta =
          document.createElement("section");

        tarjeta.innerHTML = `

          <h2>${producto.nombre}</h2>

          <p class="precio">
            $${Number(producto.precio).toLocaleString("es-AR")}
          </p>

          <p>
            ${producto.descripcion || ""}
          </p>

          <br>

          <a
            class="btn"
            target="_blank"
            href="https://wa.me/${datos.whatsapp}?text=${encodeURIComponent(
              "Hola, quiero comprar " +
              producto.nombre +
              " de $" +
              Number(producto.precio).toLocaleString("es-AR")
            )}"
          >
            🟢 Pedir por WhatsApp
          </a>

        `;

        lista.appendChild(tarjeta);

      });

    }

  </script>

</body>
</html>
